x-airflow-common: &airflow-common
  build: 
    context: .
    dockerfile: Dockerfile.airflow

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER__USERS: "admin:admin123,viewer:viewer123"

  volumes:
    - ./airflow_pipeline/dags:/opt/airflow/dags
    - ./airflow_pipeline/logs:/opt/airflow/logs
    - ./airflow_pipeline/plugins:/opt/airflow/plugins
    - ./:/opt/project

  networks:
    - fraud-network

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fraud@2026"

    ports:
      - "1455:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    restart: unless-stopped

    networks:
      - fraud-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    restart: unless-stopped

    networks:
      - fraud-network


  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Hapa tunatumia mitandao miwili tofauti kwa usahihi wa hali ya juu:
      KAFKA_LISTENERS: LISTENER_CONCURRENT://0.0.0.0:29092,LISTENER_LOCALHOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: LISTENER_CONCURRENT://kafka:29092,LISTENER_LOCALHOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_CONCURRENT:PLAINTEXT,LISTENER_LOCALHOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_CONCURRENT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped
    networks:
      - fraud-network


  postgres:
    image: postgres:15
    container_name: airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    networks:
      - fraud-network

  airflow-init:
    <<: *airflow-common

    container_name: airflow-init

    depends_on:
      - postgres

    command: >
      bash -c "
      airflow db migrate 
      "

  airflow-webserver:
    <<: *airflow-common

    container_name: airflow-webserver

    depends_on:
      - postgres

    command: airflow api-server

    ports:
      - "8080:8080"

    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common

    container_name: airflow-scheduler

    depends_on:
      - postgres

    command: airflow scheduler

    restart: unless-stopped

